[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "CDAS"
version = "0.1.0"
description = "DASCORE companion package that adds support for compressed DAS data"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Byron-Selvage", email = "bselvage@mines.edu"},
]
dependencies = [
    "numpy",
    "dascore",
]
license = {text = "LGPL-3.0-or-later"}

[project.optional-dependencies]
zfp = [
	"zfpy",
]
dev = [
	"pytest",
	"ruff",
]
docs = [
    "sphinx",
    "furo",
    "sphinx-autodoc-typehints",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["cdas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pdm]
distribution = true
[project.entry-points."dascore.fiber_io"]
zfp__1_0 = "cdas.io.zfp_fiberio:ZFPV1"
